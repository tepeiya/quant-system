services:
  m-plus:
    build: .
    ports:
      - "8765:8765"
    environment:
      - PORT=8765
      - ALPACA_API_KEY_ID=${ALPACA_API_KEY_ID}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - TIINGO_API_KEY=${TIINGO_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - PUSHPLUS_TOKEN=${PUSHPLUS_TOKEN}
      - TZ=Asia/Shanghai
      # 双策略资金分配（两策略合计 ≤ 1.0）
      - CONSERVATIVE_CAP_RATIO=${CONSERVATIVE_CAP_RATIO:-0.5}
      - MOMENTUM_CAP_RATIO=${MOMENTUM_CAP_RATIO:-0.5}
      - ALPACA_INTRADAY_KEY_ID=${ALPACA_INTRADAY_KEY_ID}
      - ALPACA_INTRADAY_SECRET=${ALPACA_INTRADAY_SECRET}
    volumes:
      - ./data_cache:/app/data_cache
      - ./signals:/app/signals
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped
