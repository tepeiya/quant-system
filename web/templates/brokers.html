{% extends "base.html" %}
{% block title %}券商管理{% endblock %}
{% block content %}

<div class="panel">
    <h2>🔌 券商列表</h2>
    <div id="brokerList" style="margin-top:8px;"></div>
</div>

<div class="panel">
    <h2>🔐 API 密钥</h2>
    <div id="keyList" style="margin-top:8px;"></div>
</div>

<script>
async function loadBrokers() {
    try {
        const d = await apiFetch('/brokers/api/list');
        const brokers = d.data || d || [];
        const div = document.getElementById('brokerList');
        div.innerHTML = brokers.map(b => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #21262d;">
                <div>
                    <b>${b.name}</b>
                    <div style="font-size:11px;color:#8b949e;">${b.type} ${b.paper ? '📄' : '🔴'}</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:12px;${b.ready ? 'color:#3fb950;' : b.enabled ? 'color:#d29922;' : 'color:#484f58;'}">
                        ${b.ready ? '✅ 就绪' : b.enabled ? '⚠️ 未配置' : '⏸️ 未启用'}
                    </span>
                    <div style="font-size:11px;color:#8b949e;margin-top:4px;">策略: ${b.strategies ? b.strategies.join(', ') : '-'}</div>
                    <button class="btn" onclick="setDefaultBroker('${b.id}')" style="padding:4px 10px;font-size:11px;${b.default ? 'background:#1f6feb;color:#fff;' : ''}">${b.default ? '⭐ 默认' : '设为默认'}</button>
                    <button class="btn" onclick="toggleBroker('${b.id}', ${b.enabled})" style="padding:5px 12px;font-size:12px;">
                        ${b.enabled ? '⏹️ 停用' : '▶️ 启用'}
                    </button>
                </div>
            </div>
        `).join('');
    } catch(e) {
        showToast('加载券商失败: ' + e.message, 'error');
    }
}

async function loadKeys() {
    try {
        const d = await apiFetch('/brokers/api/keys');
        const list = d.data?.keys || d.keys || [];
        const keyDiv = document.getElementById('keyList');
        keyDiv.innerHTML = list.map(item => `
            <div style="padding:10px;border-bottom:1px solid #21262d;">
                <div style="font-weight:600;margin-bottom:8px;">${item.name}</div>
                ${(item.fields || []).map(f => `
                    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                        <div style="min-width:180px;font-size:12px;color:#8b949e;">${f.label}</div>
                        <input id="k_${f.key}" type="${f.secret ? 'password' : 'text'}" placeholder="${f.set ? '已设置（留空不改）' : '请输入'}" style="flex:1;padding:6px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;">
                        <button class="btn" onclick="saveBrokerKey('${f.key}')" style="padding:4px 10px;">保存</button>
                    </div>
                `).join('')}
            </div>
        `).join('');
    } catch(e) {
        showToast('加载密钥失败: ' + e.message, 'error');
    }
}

async function toggleBroker(id, enabled) {
    try {
        await apiFetch('/brokers/api/toggle', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({broker_id: id, enabled: !enabled})
        });
        showToast('已更新券商状态', 'success');
        loadBrokers();
        loadKeys();
    } catch(e) {
        showToast('切换失败: ' + e.message, 'error');
    }
}

async function setDefaultBroker(id) {
    try {
        await apiFetch('/brokers/api/set_default', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({broker_id: id})
        });
        showToast('默认券商已更新', 'success');
        loadBrokers();
    } catch(e) {
        showToast('设置默认失败: ' + e.message, 'error');
    }
}

async function saveBrokerKey(key) {
    const v = document.getElementById('k_' + key).value.trim();
    if (!v) return showToast('请输入值', 'error');
    try {
        await apiFetch('/brokers/api/save_key', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({key, value: v})
        });
        showToast('已保存', 'success');
        document.getElementById('k_' + key).value = '';
        loadBrokers();
        loadKeys();
    } catch(e) {
        showToast('保存失败: ' + e.message, 'error');
    }
}

loadBrokers();
loadKeys();
</script>
{% endblock %}
