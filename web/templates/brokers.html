{% extends "base.html" %}
{% block title %}券商管理{% endblock %}
{% block content %}

<div class="panel">
    <h2>🔌 券商列表</h2>
    <div id="brokerList" style="margin-top:8px;"></div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
      <button class="btn primary" onclick="testConnections()" style="padding:5px 10px;font-size:12px;">🔌 测试连接</button>
      <span id="testResult" style="font-size:11px;color:#484f58;"></span>
    </div>
</div>

<div class="panel">
    <h2>🔐 API 密钥</h2>
    <div id="keyList" style="margin-top:8px;"></div>
</div>

<style>
.sel-strategy { font-size:11px;padding:4px 6px;border:1px solid #30363d;border-radius:5px;background:#0d1117;color:#c9d1d9; }
</style>

<script>
async function loadBrokers() {
    try {
        const d = await apiFetch('/brokers/api/list');
        const brokers = d.data || d || [];
        const div = document.getElementById('brokerList');
        div.innerHTML = brokers.map(b => {
            return `<div style="padding:12px;border-bottom:1px solid #21262d;">
                <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
                    <div style="flex:1;min-width:120px;">
                        <b style="font-size:14px;">${b.name}</b>
                        <div style="font-size:11px;color:#8b949e;">${b.type} ${b.paper ? '📄 纸交易' : '🔴 实盘'}</div>
                    </div>
                    <span style="font-size:12px;${b.ready ? 'color:#3fb950;' : b.enabled ? 'color:#d29922;' : 'color:#484f58;'}">
                        ${b.ready ? '✅ 就绪' : b.enabled ? '⚠️ 未配置' : '⏸️ 未启用'}
                    </span>
                    <button class="btn" onclick="toggleBroker('${b.id}', ${b.enabled})" style="padding:5px 10px;font-size:12px;">
                        ${b.enabled ? '⏹️ 停用' : '▶️ 启用'}
                    </button>
                </div>
            </div>`;
        }).join('');
    } catch(e) {
        showToast('加载券商失败: ' + e.message, 'error');
    }
}

if (document.querySelector('.sel-strategy')) {
    document.querySelector('.sel-strategy').style.display = 'none';
}

async function loadKeys() {
    try {
        const d = await apiFetch('/brokers/api/keys');
        const list = d.data?.keys || d.keys || [];
        document.getElementById('keyList').innerHTML = list.map(item => `
            <div style="padding:10px;border-bottom:1px solid #21262d;">
                <div style="font-weight:600;margin-bottom:8px;">${item.name}</div>
                ${(item.fields || []).map(f => `
                    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
                        <div style="min-width:160px;font-size:12px;color:#8b949e;">${f.label}</div>
                        <input id="k_${f.key}" type="${f.secret ? 'password' : 'text'}" placeholder="${f.set ? '已设置' : '未设置'}" style="flex:1;min-width:120px;padding:6px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;">
                        <button class="btn" onclick="saveBrokerKey('${f.key}')" style="padding:4px 10px;font-size:12px;">保存</button>
                    </div>
                `).join('')}
            </div>
        `).join('');
    } catch(e) {
        showToast('加载密钥失败: ' + e.message, 'error');
    }
}

async function toggleBroker(id, enabled) {
    try {
        await apiFetch('/brokers/api/toggle', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({broker_id: id, enabled: !enabled})
        });
        showToast('已更新券商状态', 'success');
        loadBrokers();
    } catch(e) {
        showToast('切换失败: ' + e.message, 'error');
    }
}

async function saveBrokerKey(key) {
    const v = document.getElementById('k_' + key).value.trim();
    if (!v) return showToast('请输入值', 'error');
    try {
        await apiFetch('/brokers/api/save_key', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({key, value: v})
        });
        showToast('已保存', 'success');
        document.getElementById('k_' + key).value = '';
        loadBrokers();
        loadKeys();
    } catch(e) {
        showToast('保存失败: ' + e.message, 'error');
    }
}

loadBrokers();
loadKeys();

async function testConnections() {
    const el = document.getElementById('testResult');
    el.textContent = '⏳ 测试中...';
    el.style.color = '#d29922';
    try {
        const d = await apiFetch('/brokers/api/test');
        const results = d.data || {};
        const lines = [];
        for (const [strategy, r] of Object.entries(results)) {
            if (r.success) {
                lines.push(`${strategy}: ✅ ${r.latency_ms}ms $${r.equity.toFixed(0)}`);
            } else {
                lines.push(`${strategy}: ❌ ${r.error}`);
            }
        }
        el.textContent = lines.join(' | ');
        el.style.color = '#8b949e';
    } catch(e) {
        el.textContent = '❌ 测试失败: ' + e.message;
        el.style.color = '#f85149';
    }
}
</script>
{% endblock %}
