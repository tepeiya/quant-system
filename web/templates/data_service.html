{% extends "base.html" %}
{% block title %}数据服务 - M+{% endblock %}
{% block content %}

<div class="panel" style="padding:14px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <h2 style="margin:0;font-size:16px;">📡 数据服务</h2>
    <div style="display:flex;gap:6px;">
      <button class="btn" onclick="updateData(false)" id="btnIncr" style="font-size:11px;padding:5px 10px;">📥 增量更新</button>
      <button class="btn primary" onclick="updateData(true)" id="btnFull" style="font-size:11px;padding:5px 10px;">📥 全量预热</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;">
    <div style="background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:10px 6px;text-align:center;">
      <div style="font-size:20px;font-weight:700;color:#58a6ff;" id="cacheAge">-</div>
      <div style="font-size:10px;color:#8b949e;margin-top:2px;">缓存时效</div>
    </div>
    <div style="background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:10px 6px;text-align:center;">
      <div style="font-size:20px;font-weight:700;color:#3fb950;" id="stocksCount">-</div>
      <div style="font-size:10px;color:#8b949e;margin-top:2px;">股票数量</div>
    </div>
    <div style="background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:10px 6px;text-align:center;">
      <div style="font-size:20px;font-weight:700;color:#d29922;" id="cacheSize">-</div>
      <div style="font-size:10px;color:#8b949e;margin-top:2px;">缓存大小</div>
    </div>
  </div>

  <!-- 进度条区域 -->
  <div id="progressArea" style="display:none;background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:12px;margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span id="progressTitle" style="font-size:12px;color:#e6edf3;font-weight:600;">⏳ 运行中...</span>
      <span id="progressCount" style="font-size:10px;color:#8b949e;"></span>
    </div>
    <div style="background:#21262d;border-radius:10px;height:20px;overflow:hidden;margin-bottom:6px;">
      <div id="progressBar" style="width:0%;height:100%;background:linear-gradient(90deg,#238636,#2ea043);border-radius:10px;transition:width .5s;"></div>
    </div>
    <div id="progressLog" style="font-size:10px;color:#8b949e;max-height:150px;overflow-y:auto;line-height:1.6;padding:4px 0;"></div>
    <div style="margin-top:6px;display:flex;gap:6px;">
      <span id="progressElapsed" style="font-size:10px;color:#484f58;"></span>
      <span id="progressStatus" style="font-size:10px;color:#d29922;"></span>
    </div>
  </div>

  <div style="background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:12px;">
    <div style="font-size:11px;color:#8b949e;margin-bottom:6px;">📋 历史日志</div>
    <div id="updateLog" style="font-size:10px;color:#484f58;min-height:30px;line-height:1.6;">
      点击「增量更新」或「全量预热」
    </div>
  </div>
</div>

<script>
let progressTimer = null;

async function loadHealth() {
  const h = await apiFetch('/data/api/health');
  document.getElementById('cacheAge').textContent = h.cache_age_hours ? h.cache_age_hours + 'h' : '无';
  document.getElementById('cacheAge').style.color = h.status === 'healthy' ? '#3fb950' : '#f85149';
  document.getElementById('stocksCount').textContent = h.stocks_count || '-';
  document.getElementById('cacheSize').textContent = h.cache_size_mb ? h.cache_size_mb + 'MB' : '-';
}

async function updateData(full) {
  if (progressTimer) return; // 已有任务

  const btn = full ? 'btnFull' : 'btnIncr';
  document.getElementById(btn).disabled = true;
  document.getElementById(btn).textContent = '⏳';

  try {
    const r = await apiFetch('/data/api/update', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({full})
    });
    if (r.status === 'error') {
      log('❌ ' + r.message);
      document.getElementById(btn).disabled = false;
      document.getElementById(btn).textContent = full ? '📥 全量预热' : '📥 增量更新';
      return;
    }
    // 开始轮询进度
    document.getElementById('progressArea').style.display = 'block';
    document.getElementById('progressTitle').textContent = full ? '📥 全量预热中...' : '📥 增量更新中...';
    document.getElementById('progressBar').style.width = '0%';
    progressTimer = setInterval(() => pollProgress(full, btn), 2000);
  } catch(e) {
    log('❌ ' + e.message);
    document.getElementById(btn).disabled = false;
    document.getElementById(btn).textContent = full ? '📥 全量预热' : '📥 增量更新';
  }
}

async function pollProgress(full, btn) {
  try {
    const p = await apiFetch('/data/api/progress');
    document.getElementById('progressBar').style.width = p.pct + '%';
    document.getElementById('progressCount').textContent = p.done + '/' + p.total + ' 已完成';
    document.getElementById('progressElapsed').textContent = '⏱ ' + p.elapsed;

    // 日志
    const logEl = document.getElementById('progressLog');
    if (p.log && p.log.length > 0) {
      logEl.innerHTML = p.log.join('<br>');
      logEl.scrollTop = logEl.scrollHeight;
    }

    if (!p.running) {
      clearInterval(progressTimer);
      progressTimer = null;
      document.getElementById(btn).disabled = false;
      document.getElementById(btn).textContent = full ? '📥 全量预热' : '📥 增量更新';

      if (p.status === 'done') {
        document.getElementById('progressTitle').textContent = '✅ ' + p.type + '完成！';
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('progressBar').style.background = 'linear-gradient(90deg,#238636,#2ea043)';
        log('✅ ' + p.type + '完成，共获取 ' + p.done + ' 只');
      } else if (p.status === 'error') {
        document.getElementById('progressTitle').textContent = '❌ ' + p.type + '失败';
        document.getElementById('progressBar').style.background = 'linear-gradient(90deg,#f85149,#da3633)';
        log('❌ 错误: ' + (p.error || '未知'));
      }

      loadHealth();

      // 5秒后隐藏进度条
      setTimeout(() => {
        document.getElementById('progressArea').style.display = 'none';
      }, 10000);
    }
  } catch(e) {
    console.error('poll error', e);
  }
}

function log(msg) {
  const el = document.getElementById('updateLog');
  el.innerHTML += '<div>[' + new Date().toLocaleTimeString() + '] ' + msg + '</div>';
  el.scrollTop = el.scrollHeight;
}

loadHealth();
</script>
{% endblock %}
