{% extends "base.html" %}
{% block title %}热图 - M+{% endblock %}
{% block content %}

<div class="flex-between mb-12">
    <h2 style="font-size:16px;font-weight:600;">🔥 行业热图</h2>
    <span style="font-size:12px;color:#8b949e;">色块大小=评分 | 颜色=周涨跌</span>
</div>

<div class="heatmap-controls flex gap-8 mb-12" style="flex-wrap:wrap;">
    <button class="btn primary" onclick="loadHeatmap()">🔄 刷新</button>
    <label style="font-size:12px;color:#8b949e;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="showLegend" checked onchange="toggleLegend()"> 图例
    </label>
</div>

<div id="heatmapContainer"></div>

<div id="legend" class="panel" style="margin-top:12px;">
    <h2>📖 图例</h2>
    <div class="flex gap-8" style="flex-wrap:wrap;margin-top:8px;">
        <div class="flex gap-4" style="align-items:center;"><div style="width:16px;height:16px;border-radius:3px;background:#3fb950;"></div><span style="font-size:12px;">涨</span></div>
        <div class="flex gap-4" style="align-items:center;"><div style="width:16px;height:16px;border-radius:3px;background:#d29922;"></div><span style="font-size:12px;">横盘</span></div>
        <div class="flex gap-4" style="align-items:center;"><div style="width:16px;height:16px;border-radius:3px;background:#f85149;"></div><span style="font-size:12px;">跌</span></div>
        <div class="flex gap-4" style="align-items:center;"><div style="width:16px;height:16px;border-radius:3px;background:#21262d;"></div><span style="font-size:12px;">无数据</span></div>
    </div>
    <div style="margin-top:8px;font-size:12px;color:#8b949e;">色块越大 = 评分越高，点击股票查看详情</div>
</div>

<!-- 股票详情弹窗 -->
<div id="stockModal" class="modal-overlay" style="display:none;" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 id="modalTitle">-</h2>
            <button class="modal-close" onclick="document.getElementById('stockModal').style.display='none'">✕</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<style>
.heatmap-sector {
    margin-bottom: 16px;
}
.heatmap-sector-title {
    font-size: 13px;
    font-weight: 600;
    color: #e6edf3;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.heatmap-sector-title .avg {
    font-size: 11px;
    color: #8b949e;
    font-weight: 400;
}
.heatmap-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}
.heatmap-cell {
    border-radius: 4px;
    padding: 6px 4px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
    min-width: 50px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.heatmap-cell:hover {
    transform: scale(1.1);
    opacity: 0.9;
    z-index: 10;
}
.heatmap-ticker {
    font-size: 10px;
    font-weight: 600;
    color: #e6edf3;
    pointer-events: none;
}
.heatmap-change {
    font-size: 9px;
    font-weight: 500;
    pointer-events: none;
}
</style>

<script>
async function loadHeatmap() {
    const container = document.getElementById('heatmapContainer');
    container.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>加载中...</p></div>';
    
    const r = await fetch('/heatmap/api/data');
    const d = await r.json();
    const sectors = d.sectors || [];
    
    if (sectors.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无数据</p></div>';
        return;
    }
    
    let html = '';
    for (const sec of sectors) {
        const scoreColor = sec.avg_score >= 60 ? '#3fb950' : (sec.avg_score >= 40 ? '#d29922' : '#f85149');
        html += '<div class="heatmap-sector">';
        html += '<div class="heatmap-sector-title">';
        html += '<span>' + sec.name + ' <span style="font-size:11px;color:#8b949e;font-weight:400;">(' + sec.count + '只)</span></span>';
        html += '<span class="avg" style="color:' + scoreColor + ';">均分 ' + sec.avg_score + '</span>';
        html += '</div>';
        html += '<div class="heatmap-grid">';
        
        for (const s of sec.stocks) {
            const size = Math.max(50, Math.min(90, 50 + s.score * 0.5));
            const change = s.weekly_change || 0;
            const color = change > 1 ? '#3fb950' : (change > -1 ? '#d29922' : (change === 0 ? '#21262d' : '#f85149'));
            const textColor = change > 1 ? '#3fb950' : (change > -1 ? '#d29922' : '#f85149');
            const changeStr = (change > 0 ? '+' : '') + change.toFixed(1) + '%';
            
            html += '<div class="heatmap-cell" style="width:' + size + 'px;height:' + (size * 0.7) + 'px;background:' + color + ';"';
            html += ' onclick="showStock(\'' + s.ticker + '\',' + s.price + ',' + s.score + ',' + s.momentum + ',' + (s.rsi || 0) + ',' + change + ')">';
            html += '<span class="heatmap-ticker">' + s.ticker + '</span>';
            html += '<span class="heatmap-change" style="color:' + textColor + ';">' + changeStr + '</span>';
            html += '</div>';
        }
        
        html += '</div></div>';
    }
    
    container.innerHTML = html;
}

function toggleLegend() {
    const legend = document.getElementById('legend');
    legend.style.display = document.getElementById('showLegend').checked ? 'block' : 'none';
}

function showStock(ticker, price, score, momentum, rsi, weeklyChange) {
    document.getElementById('modalTitle').textContent = ticker;
    const body = document.getElementById('modalBody');
    const changeClass = weeklyChange > 0 ? 'positive' : (weeklyChange < 0 ? 'negative' : 'neutral');
    body.innerHTML = '<div class="card-grid" style="grid-template-columns:repeat(2,1fr);">' +
        '<div class="card"><div class="label">现价</div><div class="value">\$' + price.toFixed(2) + '</div></div>' +
        '<div class="card"><div class="label">综合评分</div><div class="value">' + score.toFixed(0) + '</div></div>' +
        '<div class="card"><div class="label">动量(12M)</div><div class="value">' + momentum.toFixed(1) + '%</div></div>' +
        '<div class="card"><div class="label">周涨跌</div><div class="value ' + changeClass + '">' + (weeklyChange > 0 ? '+' : '') + weeklyChange.toFixed(2) + '%</div></div>' +
        '</div>';
    document.getElementById('stockModal').style.display = 'flex';
}

loadHeatmap();
</script>
{% endblock %}
