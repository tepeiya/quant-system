{% extends "base.html" %}
{% block title %}日内交易 - 量化系统{% endblock %}
{% block content %}

<div class="panel">
    <div class="flex mb-12" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <h2 style="margin:0;">⚡ 日内交易</h2>
        <div style="display:flex;gap:6px;">
            <button class="btn" onclick="refreshData()" style="font-size:12px;padding:6px 12px;">🔄 刷新</button>
            <button class="btn primary" onclick="executeScan()" style="font-size:12px;padding:6px 12px;">📡 扫描信号</button>
            <button class="btn danger" onclick="closeAllIntraday()" style="font-size:12px;padding:6px 12px;">🗑️ 清仓</button>
        </div>
    </div>

    <!-- 资金分配 -->
    <div style="margin-bottom:16px;">
        <h3 style="font-size:13px;color:#8b949e;margin:0 0 8px;">💰 资金概览</h3>
        <div class="card-grid" id="allocSummary" style="grid-template-columns:repeat(4,1fr);"></div>
    </div>

    <!-- 今日交易统计 -->
    <h3 style="font-size:13px;color:#8b949e;margin:0 0 8px;">📊 今日统计</h3>
    <div class="card-grid" id="todayStats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;"></div>

    <!-- 当前持仓 -->
    <h3 style="font-size:13px;color:#8b949e;margin:0 0 8px;">📋 日内持仓</h3>
    <div id="intradayPositions" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;"></div>

    <!-- 今日信号 -->
    <h3 style="font-size:13px;color:#8b949e;margin:0 0 8px;">📡 今日信号</h3>
    <div id="signalList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;"></div>

    <!-- 策略配置 -->
    <h3 style="font-size:13px;color:#8b949e;margin:0 0 8px;">⚙️ 策略配置</h3>
    <div id="configInfo" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;"></div>

    <!-- 回测结果 -->
    <h3 style="font-size:13px;color:#8b949e;margin:0 0 8px;">📊 回测表现</h3>
    <div id="backtestResult" style="display:flex;flex-direction:column;gap:6px;"></div>
</div>

<script>
async function refreshData() {
    // 资金
    const al = document.getElementById('allocSummary');
    try {
        const a = await apiFetch('/intraday/api/allocation');
        al.innerHTML = `
            <div class="card"><div class="label">总权益</div><div class="value">$${(a.equity||0).toFixed(0)}</div></div>
            <div class="card"><div class="label">已分配(${(a.ratio*100||20).toFixed(0)}%)</div><div class="value">$${(a.allocated||0).toFixed(0)}</div></div>
            <div class="card"><div class="label">已用</div><div class="value">$${(a.used||0).toFixed(0)}</div></div>
            <div class="card"><div class="label">可用</div><div class="value">$${(a.available||0).toFixed(0)}</div></div>`;
    } catch(e) { al.innerHTML = '<div style="color:#8b949e;">获取失败</div>'; }

    // 今日统计
    try {
        const a = await apiFetch('/intraday/api/allocation');
        const ts = document.getElementById('todayStats');
        ts.innerHTML = `
            <div class="card"><div class="label">今日交易</div><div class="value">${a.today_trades || 0} 笔</div></div>
            <div class="card"><div class="label">持仓</div><div class="value">${a.positions || 0} 只</div></div>
            <div class="card"><div class="label">PnL</div><div class="value" style="color:${(a.pnl||0) >= 0 ? '#3fb950' : '#f85149'};">${(a.pnl||0) >= 0 ? '+' : ''}$${(a.pnl||0).toFixed(0)}</div></div>`;
    } catch(e) {}

    // 持仓
    try {
        const p = await apiFetch('/intraday/api/positions');
        const pl = document.getElementById('intradayPositions');
        const pos = p.positions || [];
        if (pos.length === 0) {
            pl.innerHTML = '<div style="text-align:center;padding:16px;background:#0d1117;border-radius:8px;border:1px solid #21262d;color:#8b949e;">🈳 无日内持仓</div>';
        } else {
            pl.innerHTML = '<div style="display:flex;flex-direction:column;gap:4px;">' + pos.map(p => {
                const cls = p.pnl_pct >= 0 ? '#3fb950' : '#f85149';
                const rowPnl = ((p.current_price - p.avg_entry) * p.qty).toFixed(2);
                return `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1117;border:1px solid #21262d;border-radius:6px;">
                    <span style="font-weight:600;min-width:48px;">${p.symbol}</span>
                    <span style="font-size:12px;color:#8b949e;">x${p.qty}</span>
                    <span style="font-size:12px;color:#8b949e;">成本$${p.avg_entry.toFixed(2)}</span>
                    <span style="font-size:12px;margin-left:auto;">$${p.current_price.toFixed(2)}</span>
                    <span style="font-size:12px;color:${cls};min-width:60px;text-align:right;">${p.pnl_pct >= 0 ? '+' : ''}${p.pnl_pct.toFixed(2)}%</span>
                    <span style="font-size:11px;color:${cls};">${p.pnl_pct >= 0 ? '+' : ''}$${rowPnl}</span>
                </div>`;
            }).join('') + '</div>';
        }
    } catch(e) {}

    // 信号
    try {
        const s = await apiFetch('/intraday/api/signals');
        const list = document.getElementById('signalList');
        const cands = s.candidates || [];
        if (cands.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:16px;background:#0d1117;border-radius:8px;border:1px solid #21262d;color:#8b949e;">暂无信号</div>';
        } else {
            list.innerHTML = cands.map((c, i) => {
                const cls = c.today_chg >= 0 ? '#3fb950' : '#f85149';
                return `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1117;border:1px solid #21262d;border-radius:6px;">
                    <span style="font-size:11px;color:#484f58;min-width:24px;">#${i+1}</span>
                    <span style="font-weight:600;min-width:48px;">${c.ticker}</span>
                    <span style="font-size:12px;color:#8b949e;">$${(c.price||0).toFixed(0)}</span>
                    <span style="font-size:12px;color:${cls};margin-left:auto;">${c.today_chg > 0 ? '+' : ''}${(c.today_chg||0).toFixed(2)}%</span>
                    <span style="font-size:11px;color:#484f58;">7d:${c.week_chg > 0 ? '+' : ''}${(c.week_chg||0).toFixed(1)}%</span>
                    <span style="font-size:11px;color:#484f58;">量${(c.vol_ratio||0).toFixed(1)}x</span>
                </div>`;
            }).join('');
        }
    } catch(e) {}

    // 配置
    try {
        const c = await apiFetch('/settings/api/intraday_config');
        const ci = document.getElementById('configInfo');
        const status = c.enabled ? '<span style="color:#3fb950;">运行中</span>' : '<span style="color:#f85149;">已停用</span>';
        ci.innerHTML = '<div style="display:flex;gap:10px;flex-wrap:wrap;padding:10px;background:#0d1117;border:1px solid #21262d;border-radius:8px;">' +
            '<span style="font-size:11px;color:#484f58;">状态 ' + status + '</span>' +
            '<span style="font-size:11px;color:#484f58;">最大持仓 ' + (c.max_positions||3) + '只</span>' +
            '<span style="font-size:11px;color:#484f58;">单只 ' + ((c.per_position_pct||15)*100).toFixed(0) + '%</span>' +
            '<span style="font-size:11px;color:#484f58;">止损 ' + (c.stop_loss_pct||2).toFixed(1) + '%</span>' +
            '<span style="font-size:11px;color:#484f58;">止盈 ' + (c.take_profit_pct||3).toFixed(1) + '%</span>' +
            '<span style="font-size:11px;color:#484f58;">扫描间隔 ' + (c.scan_interval_minutes||30) + '分钟</span>' +
            '</div>';
    } catch(e) {}

    // 回测
    try {
        const b = await apiFetch('/intraday/api/backtest');
        const bt = document.getElementById('backtestResult');
        bt.innerHTML = `<div class="card-grid" style="grid-template-columns:repeat(4,1fr);">
            <div class="card"><div class="label">总收益</div><div class="value" style="color:${(b.total_return_pct||0) >= 0 ? '#3fb950' : '#f85149'};">${(b.total_return_pct||0).toFixed(1)}%</div></div>
            <div class="card"><div class="label">交易</div><div class="value">${b.total_trades||0}笔</div></div>
            <div class="card"><div class="label">胜率</div><div class="value" style="color:${(b.win_rate_pct||0) >= 50 ? '#3fb950' : '#d29922'};">${(b.win_rate_pct||0).toFixed(0)}%</div></div>
            <div class="card"><div class="label">最大回撤</div><div class="value" style="color:#f85149;">${(b.max_drawdown_pct||0).toFixed(1)}%</div></div>
        </div>`;
    } catch(e) {
        document.getElementById('backtestResult').innerHTML = '<div style="text-align:center;padding:16px;color:#8b949e;">暂无回测数据，点扫描生成</div>';
    }
}

async function executeScan() {
    try {
        const d = await apiFetch('/intraday/api/scan', {method:'POST'});
        showToast('扫描完成: ' + (d.candidates||[]).length + '只信号', 'success');
        refreshData();
    } catch(e) {
        showToast('扫描失败: ' + e.message, 'error');
    }
}

async function closeAllIntraday() {
    if (!confirm('确认清仓所有日内持仓？')) return;
    try {
        const d = await apiFetch('/intraday/api/close_all', {method:'POST'});
        showToast(d.message, 'success');
        refreshData();
    } catch(e) {
        showToast('清仓失败: ' + e.message, 'error');
    }
}

refreshData();
setInterval(refreshData, 60000);
</script>
{% endblock %}
