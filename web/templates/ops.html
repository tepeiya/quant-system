{% extends "base.html" %}
{% block title %}运维中心{% endblock %}
{% block content %}

<style>
.task-card {
    background:#161b22;border:1px solid #30363d;border-radius:10px;
    padding:14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;
    align-items:center;transition:border-color .2s;
}
.task-card:hover { border-color:#58a6ff; }
.task-info { flex:1;min-width:150px; }
.task-info h3 { margin:0 0 2px;font-size:14px;color:#e6edf3; }
.task-info p { margin:0;font-size:11px;color:#8b949e;line-height:1.4; }
.task-status { font-size:10px;padding:3px 8px;border-radius:12px;white-space:nowrap; }
.status-idle { color:#8b949e;background:#21262d; }
.status-ok { color:#3fb950;background:rgba(63,185,80,.15); }
.status-error { color:#f85149;background:rgba(248,81,73,.15); }
.status-running { color:#d29922;background:rgba(210,153,34,.15);animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.btn-group { display:flex;gap:6px;flex-wrap:wrap; }
.btn-sm { padding:6px 12px;font-size:11px;border-radius:6px;border:none;cursor:pointer;white-space:nowrap; }
.btn-run { background:#238636;color:#fff; }
.btn-run:hover { background:#2ea043; }
.btn-run:disabled { background:#21262d;color:#484f58;cursor:not-allowed; }
.btn-log { background:#21262d;color:#c9d1d9;border:1px solid #30363d; }
.btn-log:hover { background:#30363d; }
</style>

<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
    <h2 style="margin:0;font-size:18px;">🛠️ 运维中心</h2>
    <span id="runningBadge" class="task-status status-idle">⏸️ 空闲</span>
    <span style="font-size:10px;color:#484f58;margin-left:auto;">每30秒刷新</span>
</div>

<div id="taskList"></div>

<!-- 回测结果对比面板 -->
<div id="btComparePanel" style="display:none;margin-top:12px;background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="font-size:13px;color:#e6edf3;">📊 回测结果对比</strong>
        <button class="btn-sm btn-log" onclick="document.getElementById('btComparePanel').style.display='none'">✕ 关闭</button>
    </div>
    <!-- 对比卡片 -->
    <div id="btCompareContent"></div>
    <!-- 净值曲线 -->
    <div style="margin-top:10px;">
        <div style="font-size:11px;color:#8b949e;margin-bottom:4px;">📈 净值曲线</div>
        <canvas id="equityChart" style="width:100%;height:200px;"></canvas>
    </div>
</div>

<div id="logPanel" style="display:none;margin-top:12px;background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong id="logTitle" style="font-size:13px;color:#e6edf3;">日志</strong>
        <button class="btn-sm btn-log" onclick="closeLog()">✕ 关闭</button>
    </div>
    <pre id="logContent" style="margin:0;font-size:11px;line-height:1.5;color:#c9d1d9;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;"></pre>
</div>

<script>
const TASKS = [
    {id:'daemon_start',name:'🤖 启动自动交易',desc:'全天候自动交易（数据→信号→调仓）'},
    {id:'daemon_stop',name:'⏹️ 停止自动交易',desc:'停止守护进程'},
    {id:'intraday_scan',name:'⚡ 日内扫描',desc:'扫描日内信号并执行'},
    {id:'intraday_close',name:'🗑️ 日内清仓',desc:'强制清仓日内持仓'},
    {id:'risk_check',name:'🛡️ 风控检查',desc:'检查止损+熔断+仓位限制'},
    {id:'refresh_now',name:'🔄 实时刷新',desc:'增量更新缓存'},
    {id:'run_signal',name:'🏆 生成信号',desc:'生成今日选股信号'},
    {id:'run_backtest',name:'📊 运行回测',desc:'执行完整回测'},
    {id:'run_event_backtest',name:'🎯 事件驱动回测',desc:'逐日模拟·含滑点佣金'},
    {id:'data_warmup',name:'📥 数据预热',desc:'下载全部股票历史数据'},
    {id:'evolve_factors',name:'🧬 因子进化',desc:'自动调整因子权重'},
    {id:'export_report',name:'📄 导出回测报告',desc:'生成SPY对比报告'},
    {id:'git_pull',name:'⬇️ 从GitHub更新',desc:'拉取最新代码并重启'},
];

async function loadStatus() {
    try {
        const d = await apiFetch('/ops/api/status');
        const running = d.running, current = d.current || '', last = d.last || {}, daemon = d.daemon || {};
        const badge = document.getElementById('runningBadge');
        if (daemon.running) { badge.className = 'task-status status-running'; badge.textContent = '🤖 守护运行中'; }
        else if (running) { badge.className = 'task-status status-running'; badge.textContent = '🔄 运行中'; }
        else {
            const anyErr = Object.values(last).some(v => v && v.status === 'error');
            const anyOk = Object.values(last).some(v => v && v.status === 'ok');
            if (anyErr) { badge.className = 'task-status status-error'; badge.textContent = '⚠️ 有任务失败'; }
            else if (anyOk) { badge.className = 'task-status status-ok'; badge.textContent = '✅ 就绪'; }
            else { badge.className = 'task-status status-idle'; badge.textContent = '⏸️ 空闲'; }
        }
        const list = document.getElementById('taskList');
        list.innerHTML = TASKS.map(t => {
            const st = (last&&last[t.id])||{}, isRunning = running && current === t.id;
            let stText = '等待运行', stCls = 'status-idle', btnOff = running;
            if (t.id === 'daemon_start') {
                if (daemon.running) { stText = '✅ 运行中'; stCls = 'status-ok'; btnOff = true; }
            } else if (t.id === 'daemon_stop') {
                if (daemon.running) { stText = '🟢 运行中'; stCls = 'status-ok'; }
                else { stText = '等待运行'; stCls = 'status-idle'; btnOff = true; }
            } else {
                if (isRunning) { stText = '🔄 运行中'; stCls = 'status-running'; }
                else if (st.status === 'ok') { stText = '✅ '+(st.time||'').slice(5,16); stCls = 'status-ok'; }
                else if (st.status === 'error') { stText = '❌ '+(st.error||'').slice(0,20); stCls = 'status-error'; }
            }
            return `<div class="task-card">
                <div class="task-info">
                    <h3>${t.name}</h3>
                    <p>${t.desc}</p>
                </div>
                <span class="task-status ${stCls}">${stText}</span>
                <div class="btn-group">
                    <button class="btn-sm btn-run" id="run_${t.id}" onclick="runTask('${t.id}')" ${btnOff?'disabled':''}>▶️ 运行</button>
                    <button class="btn-sm btn-log" onclick="showLog('${t.id}')">📋 日志</button>
                </div>
            </div>`;
        }).join('');
    } catch(e) {}
}

async function runTask(id) {
    const btn = document.getElementById('run_'+id); if(btn){btn.disabled=true;btn.textContent='⏳';}
    try { const d = await apiFetch('/ops/api/'+id,{method:'POST'}); showToast(d.message||'已启动',d.status==='ok'?'success':'error'); }
    catch(e) { showToast('失败: '+e.message,'error'); }
    setTimeout(loadStatus, id.startsWith('daemon')?5000:1000);
    // 回测任务完成2秒后自动加载对比结果
    if (id === 'run_backtest' || id === 'run_event_backtest') {
        setTimeout(loadBtCompare, 3000);
    }
}

async function showLog(id) {
    const map={daemon_start:'daemon',daemon_stop:'daemon',refresh_now:'refresh',data_warmup:'backtest',run_backtest:'backtest',run_signal:'signal',evolve_factors:'evolve',export_report:'export',run_event_backtest:'event_backtest'};
    const key=map[id]||id, task=TASKS.find(t=>t.id===id);
    document.getElementById('logPanel').style.display='block';
    document.getElementById('logTitle').textContent=(task?task.name:id)+' — 日志';
    document.getElementById('logContent').textContent='加载中...';
    try { const d=await apiFetch('/ops/api/log/'+key); document.getElementById('logContent').textContent=(d.data&&d.data.log)||'(暂无日志)'; }
    catch(e) { document.getElementById('logContent').textContent='获取失败: '+e.message; }
}
function closeLog(){document.getElementById('logPanel').style.display='none';}

// ===== 回测对比 =====
async function loadBtCompare() {
    try {
        var vec, evt;
        try { vec = await apiFetch('/ops/api/backtest_result'); } catch(e) {}
        try { evt = await apiFetch('/ops/api/event_backtest_result'); } catch(e) {}

        if (!vec && !evt) return;

        var panel = document.getElementById('btComparePanel');
        panel.style.display = 'block';

        var content = document.getElementById('btCompareContent');
        var html = '<div style="display:flex;gap:6px;flex-wrap:wrap;">';

        if (vec) {
            var v = vec.data || vec;
            html += '<div style="flex:1;min-width:130px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px;">';
            html += '<div style="font-size:11px;color:#8b949e;margin-bottom:6px;">📊 向量化回测</div>';
            html += metricRow('总收益', (v.total_return_pct||0).toFixed(1)+'%', (v.total_return_pct||0)>=0);
            html += metricRow('年化收益', (v.annual_return_pct||0).toFixed(1)+'%', (v.annual_return_pct||0)>=0);
            html += metricRow('最大回撤', (v.max_drawdown_pct||0).toFixed(1)+'%', false);
            html += metricRow('夏普比率', (v.sharpe_ratio||0).toFixed(2), (v.sharpe_ratio||0)>=1);
            html += metricRow('Alpha', (v.alpha||0).toFixed(2)+'%', (v.alpha||0)>=0);
            html += '</div>';
        }

        if (evt) {
            var e = evt.data || evt;
            html += '<div style="flex:1;min-width:130px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px;">';
            html += '<div style="font-size:11px;color:#8b949e;margin-bottom:6px;">🎯 事件驱动回测</div>';
            html += metricRow('总收益', (e.total_return_pct||0).toFixed(1)+'%', (e.total_return_pct||0)>=0);
            html += metricRow('年化收益', (e.annual_return_pct||0).toFixed(1)+'%', (e.annual_return_pct||0)>=0);
            html += metricRow('最大回撤', (e.max_drawdown_pct||0).toFixed(1)+'%', false);
            html += metricRow('夏普比率', (e.sharpe_ratio||0).toFixed(2), (e.sharpe_ratio||0)>=1);
            html += metricRow('交易笔数', e.total_trades||0, true);
            html += '</div>';
        }

        html += '</div>';
        content.innerHTML = html;

        // 净值曲线（取事件驱动的净值点）
        if (evt) {
            var e2 = evt.data || evt;
            var points = e2.equity_points || [];
            if (points.length > 0) {
                drawEquityChart(points, e2.total_return_pct);
            }
        }

    } catch(e) {}
}

function metricRow(label, value, positive) {
    var color = positive ? '#3fb950' : (value.indexOf('-')>=0 ? '#f85149' : '#8b949e');
    return '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid #21262d;"><span style="color:#8b949e;">'+label+'</span><span style="color:'+color+';font-weight:600;">'+value+'</span></div>';
}

function drawEquityChart(points, totalReturn) {
    var canvas = document.getElementById('equityChart');
    if (!canvas || !window.Chart) return;
    if (window.eqChart) { window.eqChart.destroy(); }

    canvas.style.display = 'block';

    var labels = points.map(function(p){ return p.date; });
    var values = points.map(function(p){ return p.value; });
    var color = (totalReturn||0) >= 0 ? 'rgba(63,185,80,' : 'rgba(248,81,73,';

    window.eqChart = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '净值',
                data: values,
                borderColor: color + '0.8)',
                backgroundColor: color + '0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 0,
                borderWidth: 2,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(ctx) {
                            return '$' + ctx.parsed.y.toFixed(0);
                        }
                    }
                }
            },
            scales: {
                x: { 
                    grid: { display: false },
                    ticks: { color: '#8b949e', font: { size: 9 }, maxTicksLimit: 8 }
                },
                y: {
                    grid: { color: '#21262d' },
                    ticks: { color: '#8b949e', font: { size: 9 }, callback: function(v) { return '$' + v.toFixed(0); } }
                }
            }
        }
    });
}

// 自动加载对比
setTimeout(loadBtCompare, 1000);
loadStatus();
setInterval(loadStatus,30000);
</script>
{% endblock %}
