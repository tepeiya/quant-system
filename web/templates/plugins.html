{% extends "base.html" %}
{% block title %}插件管理 - M+{% endblock %}
{% block content %}

<div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <h2 style="margin:0;font-size:16px;">🧩 策略插件管理</h2>
    <div style="display:flex;gap:6px;">
      <button class="btn" onclick="runAll()" style="font-size:11px;padding:5px 10px;">▶️ 全部执行</button>
      <button class="btn primary" onclick="refreshAll()" style="font-size:11px;padding:5px 10px;">🔄 刷新</button>
    </div>
  </div>

  <!-- 概览 -->
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:12px;">
    <div style="background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:22px;font-weight:700;color:#58a6ff;" id="pluginCount">-</div>
      <div style="font-size:11px;color:#8b949e;">已加载插件</div>
    </div>
    <div style="background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:22px;font-weight:700;color:#3fb950;" id="enabledCount">-</div>
      <div style="font-size:11px;color:#8b949e;">已启用</div>
    </div>
    <div style="background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px;text-align:center;">
      <div style="font-size:22px;font-weight:700;color:#d29922;" id="pendingCount">-</div>
      <div style="font-size:11px;color:#8b949e;">总线待处理</div>
    </div>
  </div>

  <!-- 插件列表 -->
  <div id="pluginList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;"></div>

  <!-- 未发现的插件 -->
  <div id="unloadedSection" style="display:none;margin-bottom:12px;">
    <div style="font-size:12px;color:#8b949e;margin-bottom:6px;">📂 未加载的插件目录</div>
    <div id="unloadedList" style="display:flex;flex-direction:column;gap:4px;"></div>
  </div>

  <!-- 执行结果 -->
  <div style="font-size:12px;color:#8b949e;margin-bottom:4px;">📋 执行日志</div>
  <div id="execLog" style="background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px;min-height:40px;font-size:11px;color:#484f58;">
    点击插件右侧「▶️ 执行」或「全部执行」
  </div>
</div>

<script>
async function refreshAll() {
  await loadPlugins();
  await discoverPlugins();
}

async function loadPlugins() {
  const d = await apiFetch('/plugins/api/list');
  document.getElementById('pluginCount').textContent = d.length;
  document.getElementById('enabledCount').textContent = d.filter(p => p.enabled !== false).length;

  const status = await apiFetch('/plugins/api/status');
  document.getElementById('pendingCount').textContent = status.bus_pending ?? '0';

  const pl = document.getElementById('pluginList');
  pl.innerHTML = '';
  if (d.length === 0) {
    pl.innerHTML = '<div style="padding:20px;text-align:center;color:#484f58;font-size:12px;">暂无插件</div>';
    return;
  }
  for (const p of d) {
    const scheduleLabel = {daily:'📅 每日', intraday:'⏱️ 盘中', manual:'🖐️ 手动'}[p.schedule] || p.schedule;
    const statusColor = p.enabled !== false ? '#3fb950' : '#484f58';
    const statusIcon = p.enabled !== false ? '🟢' : '⚪';
    pl.innerHTML += `
      <div style="background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span>${statusIcon}</span>
          <div style="flex:1;">
            <div style="font-weight:600;font-size:13px;color:#e6edf3;">${p.display_name || p.name}</div>
            <div style="font-size:10px;color:#8b949e;margin-top:2px;">${p.description || ''}</div>
          </div>
          <span style="font-size:10px;color:#484f58;">v${p.version}</span>
          <span style="font-size:10px;color:#58a6ff;">${scheduleLabel}</span>
          <button class="btn" onclick="runPlugin('${p.name}')" style="font-size:11px;padding:4px 8px;">▶️ 执行</button>
        </div>
      </div>
    `;
  }
}

async function discoverPlugins() {
  const d = await apiFetch('/plugins/api/discover');
  if (d.unloaded && d.unloaded.length > 0) {
    document.getElementById('unloadedSection').style.display = 'block';
    const ul = document.getElementById('unloadedList');
    ul.innerHTML = d.unloaded.map(name => `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:#0d1117;border:1px solid #21262d;border-radius:4px;font-size:11px;">
        <span style="color:#484f58;">📁</span>
        <span style="color:#8b949e;">${name}</span>
        <span style="color:#484f58;font-size:10px;">已发现但未加载</span>
      </div>
    `).join('');
  } else {
    document.getElementById('unloadedSection').style.display = 'none';
  }
}

async function runPlugin(name) {
  const btn = event.target;
  btn.textContent = '⏳';
  btn.disabled = true;
  try {
    const r = await apiFetch('/plugins/api/run/' + name, {method:'POST'});
    log(`✅ [${name}] ${r.message || '执行完成'}`);
  } catch(e) {
    log(`❌ [${name}] ${e.message}`);
  }
  btn.textContent = '▶️ 执行';
  btn.disabled = false;
}

async function runAll() {
  log('🔄 全部插件执行中...');
  try {
    const r = await apiFetch('/plugins/api/run_all', {method:'POST'});
    const results = r.results || {};
    for (const [name, signals] of Object.entries(results)) {
      log(`  ✅ ${name}: ${signals.length}条信号`);
    }
    log(`🏁 全部完成，共 ${r.total || 0} 条信号`);
  } catch(e) {
    log(`❌ 执行失败: ${e.message}`);
  }
}

function log(msg) {
  const el = document.getElementById('execLog');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div style="padding:2px 0;">[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
  if (el.children.length > 50) el.innerHTML = el.children.slice(-50).map(c => c.outerHTML).join('');
}

refreshAll();
setInterval(refreshAll, 30000);
</script>
{% endblock %}
