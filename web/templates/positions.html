{% extends "base.html" %}
{% block title %}持仓 - 量化系统{% endblock %}
{% block content %}

<!-- 顶部摘要卡片 -->
<div class="card-grid" id="posSummary">
    <div class="card"><div class="label">持仓数量</div><div class="value" id="posCount">-</div></div>
    <div class="card"><div class="label">总成本</div><div class="value" id="totalCost">-</div></div>
    <div class="card"><div class="label">总市值</div><div class="value" id="totalValue">-</div></div>
    <div class="card"><div class="label">总盈亏</div><div class="value" id="totalPnl">-</div><div class="sub" id="totalPnlPct"></div></div>
    <div class="card"><div class="label">仓位</div><div class="value" id="exposure">-</div></div>
    <div class="card"><div class="label">现金</div><div class="value" id="cash">-</div></div>
</div>

<div style="display:flex;gap:8px;margin-bottom:12px;">
    <button class="btn" onclick="refreshPos()" style="flex:1;font-size:12px;padding:8px;">🔄 刷新</button>
    <button class="btn danger" onclick="closeAll()" style="flex:1;font-size:12px;padding:8px;">🗑️ 清仓</button>
</div>

<!-- 持仓明细卡片列表（手机友好） -->
<h3 style="font-size:13px;color:#8b949e;margin:0 0 8px;">📋 持仓明细</h3>
<div id="positionsList" style="display:flex;flex-direction:column;gap:8px;"></div>

<!-- 最近交易 -->
<h3 style="font-size:13px;color:#8b949e;margin:16px 0 8px;">📝 最近交易</h3>
<div id="tradeLogList" style="display:flex;flex-direction:column;gap:6px;"></div>

<style>
.pos-card {
    background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;
}
.pos-header {
    display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.pos-symbol {
    font-size:18px;font-weight:700;color:#e6edf3;
}
.pos-pnl-badge {
    font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;
}
.pos-details {
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}
.pos-detail {
    text-align:center;
}
.pos-detail .label {
    font-size:10px;color:#484f58;margin-bottom:2px;
}
.pos-detail .value {
    font-size:14px;font-weight:600;color:#c9d1d9;
}
.trade-row {
    display:flex;align-items:center;padding:8px 12px;
    background:#0d1117;border:1px solid #21262d;border-radius:6px;gap:8px;
    font-size:12px;
}
.trade-row .time { color:#484f58;min-width:80px; }
.trade-row .side { font-weight:600;min-width:36px; }
.trade-row .sym { font-weight:600;min-width:50px; }
.trade-row .detail { color:#8b949e;margin-left:auto; }
</style>

<script>
async function refreshPos() {
    const d = await apiFetch('/positions/api/data');
    const pos = d.positions || [];
    const s = d.summary || {};
    const eq = d.equity || 0;

    // 摘要卡
    $('posCount').textContent = s.count + '只';
    $('totalCost').textContent = formatCurrency(s.total_cost);
    $('totalValue').textContent = formatCurrency(s.total_value);
    const pnlEl = $('totalPnl');
    pnlEl.textContent = formatCurrency(s.total_pnl);
    pnlEl.className = 'value ' + pnlClass(s.total_pnl);
    $('totalPnlPct').textContent = formatPct(s.total_pnl_pct);
    $('exposure').textContent = (s.exposure_pct || 0).toFixed(1) + '%';
    $('cash').textContent = formatCurrency(d.cash);

    // 持仓卡片列表
    const list = $('positionsList');
    if (pos.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:30px;color:#8b949e;">📭 空仓</div>';
    } else {
        list.innerHTML = pos.map(p => {
            const pnl = p.pnl || 0;
            const pnlPct = p.pnl_pct || 0;
            const pnlColor = pnl >= 0 ? '#3fb950' : '#f85149';
            const pnlBg = pnl >= 0 ? 'rgba(63,185,80,0.15)' : 'rgba(248,81,73,0.15)';
            const pnlIcon = pnl >= 0 ? '🟢' : '🔴';
            return `<div class="pos-card">
                <div class="pos-header">
                    <span class="pos-symbol">${p.symbol}</span>
                    <span class="pos-pnl-badge" style="background:${pnlBg};color:${pnlColor};">${pnlIcon} ${formatPct(pnlPct)}</span>
                    <span style="margin-left:auto;font-size:13px;color:#8b949e;">x${p.qty}</span>
                </div>
                <div class="pos-details">
                    <div class="pos-detail"><div class="label">均价</div><div class="value">$${(p.avg_entry || 0).toFixed(2)}</div></div>
                    <div class="pos-detail"><div class="label">现价</div><div class="value">$${(p.current_price || 0).toFixed(2)}</div></div>
                    <div class="pos-detail"><div class="label">市值</div><div class="value">${formatCurrency(p.market_value)}</div></div>
                    <div class="pos-detail"><div class="label">盈亏</div><div class="value" style="color:${pnlColor};">${formatCurrency(pnl)}</div></div>
                </div>
            </div>`;
        }).join('');
    }

    // 交易记录卡片
    const trades = await apiFetch('/positions/api/trade_log');
    const tList = $('tradeLogList');
    if (trades.length === 0) {
        tList.innerHTML = '<div style="text-align:center;padding:20px;color:#8b949e;font-size:13px;">暂无交易</div>';
    } else {
        tList.innerHTML = trades.slice().reverse().slice(0, 15).map(t => {
            const sideClass = t.side?.toUpperCase() === 'BUY' ? '#3fb950' : '#f85149';
            const sideIcon = t.side?.toUpperCase() === 'BUY' ? '🟢' : '🔴';
            return `<div class="trade-row">
                <span class="time">${(t.time || '').slice(5, 16)}</span>
                <span class="side" style="color:${sideClass};">${sideIcon} ${t.side?.toUpperCase()}</span>
                <span class="sym">${t.symbol}</span>
                <span class="detail">x${t.qty} @ $${(t.price || 0).toFixed(2)}</span>
            </div>`;
        }).join('');
    }
}

async function closeAll() {
    if (!confirm('确认全部清仓？')) return;
    try {
        const d = await apiFetch('/positions/api/close_all', { method: 'POST' });
        alert(d.message);
        refreshPos();
    } catch(e) {
        alert('清仓失败: ' + e);
    }
}

refreshPos();
setInterval(refreshPos, 60000);
</script>
{% endblock %}
