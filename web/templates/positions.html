{% extends "base.html" %}
{% block title %}持仓 - 量化系统{% endblock %}
{% block content %}

<div class="card-grid" id="posSummary">
    <div class="card"><div class="label">持仓数量</div><div class="value" id="posCount">-</div></div>
    <div class="card"><div class="label">总成本</div><div class="value" id="totalCost">-</div></div>
    <div class="card"><div class="label">总市值</div><div class="value" id="totalValue">-</div></div>
    <div class="card"><div class="label">总PnL</div><div class="value" id="totalPnl">-</div><div class="sub" id="totalPnlPct"></div></div>
    <div class="card"><div class="label">仓位比例</div><div class="value" id="exposure">-</div></div>
    <div class="card"><div class="label">现金</div><div class="value" id="cash">-</div></div>
</div>

<div class="row-2">
    <div class="panel">
        <div class="flex mb-12" style="justify-content:space-between">
            <h2>📋 持仓明细</h2>
            <div class="flex">
                <button class="btn" onclick="refreshPos()">🔄 刷新</button>
                <button class="btn danger" onclick="closeAll()">🗑️ 清仓</button>
            </div>
        </div>
        <div class="table-wrapper">
        <table id="positionsTable">
            <thead>
                <tr>
                    <th>股票</th><th>数量</th><th>均价</th><th>现价</th>
                    <th>成本</th><th>市值</th><th>PnL</th><th>PnL%</th><th>占比</th>
                </tr>
            </thead>
            <tbody id="positionsBody"></tbody>
        </table>
        </div>
    </div>
    <div class="panel">
        <h2>📈 持仓成本对比</h2>
        <canvas id="costChart" height="200"></canvas>
    </div>
</div>

<div class="panel">
    <h2>📝 最近交易</h2>
    <div class="table-wrapper">
    <table id="tradeLogTable">
        <thead><tr><th>时间</th><th>操作</th><th>股票</th><th>数量</th><th>价格</th><th>金额</th></tr></thead>
        <tbody id="tradeLogBody"></tbody>
    </table>
    </div>
</div>

<script>
async function refreshPos() {
    const d = await apiFetch('/positions/api/data');
    const pos = d.positions || [];
    const s = d.summary || {};
    const eq = d.equity || 0;

    // 摘要卡
    $('posCount').textContent = s.count + '只';
    $('totalCost').textContent = formatCurrency(s.total_cost);
    $('totalValue').textContent = formatCurrency(s.total_value);
    const pnlEl = $('totalPnl');
    pnlEl.textContent = formatCurrency(s.total_pnl);
    pnlEl.className = 'value ' + pnlClass(s.total_pnl);
    $('totalPnlPct').textContent = formatPct(s.total_pnl_pct);
    $('exposure').textContent = (s.exposure_pct || 0).toFixed(1) + '%';
    $('cash').textContent = formatCurrency(d.cash);

    // 持仓表格
    const body = $('positionsBody');
    if (pos.length === 0) {
        body.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#8b949e;">空仓</td></tr>';
    } else {
        body.innerHTML = pos.map(p => `
            <tr>
                <td><b>${p.symbol}</b></td>
                <td>${p.qty}</td>
                <td>$${(p.avg_entry || 0).toFixed(2)}</td>
                <td>$${(p.current_price || 0).toFixed(2)}</td>
                <td>${formatCurrency(p.cost_basis)}</td>
                <td>${formatCurrency(p.market_value)}</td>
                <td class="${pnlClass(p.pnl)}">${formatCurrency(p.pnl)}</td>
                <td class="${pnlClass(p.pnl_pct)}">${formatPct(p.pnl_pct)}</td>
                <td>${((p.market_value || 0) / eq * 100).toFixed(1)}%</td>
            </tr>
        `).join('');
    }

    // 交易记录
    const trades = await apiFetch('/positions/api/trade_log');
    const tBody = $('tradeLogBody');
    if (trades.length === 0) {
        tBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#8b949e;">暂无交易</td></tr>';
    } else {
        tBody.innerHTML = trades.slice().reverse().slice(0, 20).map(t => {
            const sideClass = t.side?.toUpperCase() === 'BUY' ? 'badge buy' : 'badge sell';
            return `<tr>
                <td>${(t.time || '').slice(0, 16)}</td>
                <td><span class="${sideClass}">${t.side?.toUpperCase()}</span></td>
                <td><b>${t.symbol}</b></td>
                <td>${t.qty}</td>
                <td>$${(t.price || 0).toFixed(2)}</td>
                <td>${formatCurrency(t.value)}</td>
            </tr>`;
        }).join('');
    }

    // 持仓成本对比图
    drawCostChart(pos, eq);
}

function drawCostChart(positions, equity) {
    if (!positions.length || !window.Chart) return;
    const ctx = document.getElementById('costChart').getContext('2d');
    const labels = positions.map(p => p.symbol);
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '成本',
                    data: positions.map(p => p.cost_basis || 0),
                    backgroundColor: 'rgba(88,166,255,0.6)',
                    borderRadius: 3,
                },
                {
                    label: '当前市值',
                    data: positions.map(p => p.market_value || 0),
                    backgroundColor: positions.map(p => (p.market_value || 0) >= (p.cost_basis || 0) ? 'rgba(63,185,80,0.6)' : 'rgba(248,81,73,0.6)'),
                    borderRadius: 3,
                }
            ]
        },
        options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#8b949e' } } },
            scales: {
                x: { grid: { display: false }, ticks: { color: '#8b949e' } },
                y: { grid: { color: '#21262d' }, ticks: { color: '#8b949e', callback: v => '$' + v.toLocaleString() } }
            }
        }
    });
}

async function closeAll() {
    if (!confirm('确认全部清仓？')) return;
    try {
        const d = await apiFetch('/positions/api/close_all', { method: 'POST' });
        alert(d.message);
        refreshPos();
    } catch(e) {
        alert('清仓失败: ' + e);
    }
}

refreshPos();
setInterval(refreshPos, 60000);
</script>
{% endblock %}
