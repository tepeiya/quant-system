{% extends "base.html" %}
{% block title %}信号 - 量化系统{% endblock %}
{% block content %}

<div class="panel">
    <div class="flex mb-12" style="justify-content:space-between">
        <h2>🏆 今日信号 Top 10</h2>
        <div class="flex">
            <button class="btn" onclick="refreshSignals()">🔄 刷新</button>
            <button class="btn primary" onclick="executeTrade()">⚡ 调仓</button>
        </div>
    </div>
    <div class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th>#</th><th>股票</th><th>评分</th><th>价格</th>
                <th>动量%</th><th>质量分</th><th>RSI</th><th>ATR</th>
            </tr>
        </thead>
        <tbody id="signalsBody"></tbody>
    </table>
    </div>
</div>

<div class="panel">
    <h2>🟢 买入候选</h2>
    <div class="table-wrapper">
    <table>
        <thead><tr><th>#</th><th>股票</th><th>评分</th><th>价格</th><th>动量%</th><th>质量分</th></tr></thead>
        <tbody id="candidatesBody"></tbody>
    </table>
    </div>
</div>

<div id="executeResult" class="panel" style="display:none"></div>

<script>
async function refreshSignals() {
    const r = await fetch('/signals/api/today');
    const d = await r.json();
    const topScores = d.top_scores || [];
    const buyCandidates = d.buy_candidates || [];

    // Top 10
    const sBody = $('signalsBody');
    if (topScores.length === 0) {
        sBody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#8b949e;">暂无数据</td></tr>';
    } else {
        sBody.innerHTML = topScores.map((s, i) => {
            const volClass = s.vol_factor === '放大' ? 'positive' : (s.vol_factor === '缩减' ? 'negative' : 'neutral');
            return `<tr>
                <td>${i + 1}</td>
                <td><b>${s.ticker}</b></td>
                <td>${s.score?.toFixed(1)}</td>
                <td>$${(s.price || 0).toFixed(2)}</td>
                <td class="${pnlClass(s.mom)}">${formatPct(s.mom)}</td>
                <td>${(s.quality || 0).toFixed(1)}</td>
                <td>${s.rsi ?? '-'}</td>
                <td>${s.atr ? s.atr.toFixed(1) + '%' : '-'}</td>
                <td class="${volClass}">${s.vol_factor || '-'}</td>
            </tr>`;
        }).join('');
    }

    // 买入候选
    const cBody = $('candidatesBody');
    if (buyCandidates.length === 0) {
        cBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#8b949e;">暂无候选</td></tr>';
    } else {
        cBody.innerHTML = buyCandidates.map((c, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><b>${c.ticker}</b></td>
                <td>${c.score?.toFixed(1)}</td>
                <td>$${(c.price || 0).toFixed(2)}</td>
                <td class="${pnlClass(c.mom)}">${formatPct(c.mom)}</td>
                <td>${(c.quality || 0).toFixed(1)}</td>
            </tr>
        `).join('');
    }
}

async function executeTrade() {
    if (!confirm('确认执行调仓？\n\n系统将对比当前持仓与信号推荐，\n自动生成买卖指令。\n\n⚠️ 请确认市场已开盘')) return false;
    const btn = event.target;
    btn.textContent = '⏳ 执行中...';
    btn.disabled = true;
    try {
        const r = await fetch('/signals/api/execute', { method: 'POST' });
        const d = await r.json();
        const resultDiv = $('executeResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<h2>${d.status === 'ok' ? '✅' : '❌'} 调仓结果</h2><p>${d.message}</p>`;
        setTimeout(() => { resultDiv.style.display = 'none'; }, 10000);
    } catch(e) {
        alert('调仓失败: ' + e);
    }
    btn.textContent = '⚡ 调仓';
    btn.disabled = false;
    refreshSignals();
}

refreshSignals();
</script>
{% endblock %}
